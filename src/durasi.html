<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Desain - Durasi Lampu Lalu Lintas</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; color: #1e293b; text-align: center; padding: 30px 15px; margin: 0; }
        .card { background: #ffffff; max-width: 540px; margin: 0 auto; padding: 25px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; color: #0f172a; font-size: 22px; }
        p { color: #64748b; font-size: 14px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; overflow: hidden; border-radius: 8px; }
        th { background-color: #2563eb; color: #ffffff; padding: 12px; font-size: 14px; text-transform: uppercase; }
        td { padding: 14px 12px; border-bottom: 1px solid #e2e8f0; font-size: 15px; }
        .badge { padding: 5px 10px; border-radius: 20px; font-weight: bold; font-size: 13px; display: inline-block; }
        .bg-green { background-color: #dcfce7; color: #166534; }
        .bg-yellow { background-color: #fef9c3; color: #854d0e; }
        .bg-red { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Rincian Siklus Lampu Lalu Lintas</h2>
        <p>Tampilan Pratinjau Desain (Statis)</p>
        <table>
            <tr><th>Arah Jalur</th><th>Hijau Murni</th><th>Kuning</th><th>Lampu Merah</th></tr>
            <tr><td><b>Utara (U)</b></td><td><span class="badge bg-green">4 Detik</span></td><td><span class="badge bg-yellow">1 Detik</span></td><td><span class="badge bg-red">30 Detik</span></td></tr>
            <tr><td><b>Barat (B)</b></td><td><span class="badge bg-green">9 Detik</span></td><td><span class="badge bg-yellow">1 Detik</span></td><td><span class="badge bg-red">25 Detik</span></td></tr>
            <tr><td><b>Selatan (S)</b></td><td><span class="badge bg-green">14 Detik</span></td><td><span class="badge bg-yellow">1 Detik</span></td><td><span class="badge bg-red">20 Detik</span></td></tr>
            <tr><td><b>Timur (T)</b></td><td><span class="badge bg-green">4 Detik</span></td><td><span class="badge bg-yellow">1 Detik</span></td><td><span class="badge bg-red">30 Detik</span></td></tr>
        </table>
    </div>
</body>
</html>
